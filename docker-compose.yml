services:
  db:
    image: postgres:17-alpine
    container_name: keyframe-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: keyframe
      POSTGRES_PASSWORD: keyframe
      POSTGRES_DB: keyframe
    volumes:
      - keyframe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyframe -d keyframe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keyframe-pgdata:
